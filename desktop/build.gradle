compileJava {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

compileKotlin {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }
}

sourceSets {
    main.java.srcDirs = ["src/java"]
    main.kotlin.srcDirs = ["src/kotlin"]
}
sourceSets.main.resources {
    srcDirs = ["../core/assets"]
    excludes = ["reverse", "**/*.md", "**/*.awk", "**/*.sh", "**/*.ps1", "**/.gitignore", "**/.gitattributes", "**/.gitkeep", "**/*.tpproj"]
}

project.ext.mainClassName = "fr.mesabloo.heavymachdefense.desktop.DesktopLauncherKt"
project.ext.assetsDir = new File("../core/assets")

task run(dependsOn: classes, type: JavaExec) {
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
}

task debug(dependsOn: classes, type: JavaExec) {
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    debug = true
}

task dist(type: Jar) {
    manifest {
        attributes 'Main-Class': project.mainClassName
    }
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}


dist.dependsOn classes

eclipse.project.name = appName + "-desktop"


// Requires a graphical desktop, but uses a hidden window and an in-memory save.
task verifyMachineSpawning(type: JavaExec, dependsOn: testClasses) {
    group = "verification"
    description = "Checks the first mission's build queue and unit deployment with real game assets."
    main = "fr.mesabloo.heavymachdefense.desktop.MachineSpawningSmokeTest"
    classpath = sourceSets.test.runtimeClasspath
    workingDir = project.assetsDir
    if (System.getProperty("os.name").toLowerCase().contains("mac")) {
        jvmArgs "-XstartOnFirstThread"
    }
}

dependencies {
    testImplementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.2"
}

compileTestKotlin {
    kotlinOptions.jvmTarget = "11"
}
